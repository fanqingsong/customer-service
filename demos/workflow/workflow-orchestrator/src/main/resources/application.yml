server:
  port: ${PORT:9400}

commerce:
  purchase-order-app-id: purchase-order-service
  inventory-app-id: inventory-service
  payment-app-id: payment-service

dapr:
  http:
    host: ${DAPR_HTTP_HOST:127.0.0.1}
    port: ${DAPR_HTTP_PORT:3500}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.dapr: INFO
