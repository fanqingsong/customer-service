server:
  port: 9200

dapr:
  http:
    host: ${DAPR_HOST:127.0.0.1}
    port: ${DAPR_HTTP_PORT:3500}
  invocation:
    customer-service-app-id: customer-service

logging:
  level:
    com.github.wenqigilantz.service.orderservice: INFO
    io.dapr: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
