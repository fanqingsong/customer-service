server:
  port: 9100
  servlet:
    context-path: /

logging:
  level:
    io.dapr: DEBUG

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: NON_NULL

  datasource:
    url: jdbc:h2:mem:testdb;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.xml
    enabled: true

  cloud:
    config:
      enabled: false

management:
  endpoints:
    web:
      base-path: /monitoring
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
